# 叠加文件：用于独立机器自带 Caddy 发布 80/443（当前共用 VPS 不启用）
services:
  app:
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    mem_limit: 128m
